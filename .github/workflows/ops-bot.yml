name: Ops bot

# Claude, running on a schedule with the founder's Claude plan. It follows
# ops/README.md: fix what the watchdog found, keep the site healthy, do small
# agreed work, log where it left off, and write the weekly plan on Mondays.
# The founder chose fully automatic: fixes are merged once the tests pass.
on:
  schedule:
    - cron: "15 5 * * *"  # daily, 07:15 Kigali
    - cron: "30 5 * * 1"  # Mondays, 07:30 Kigali (weekly plan)
  workflow_dispatch:
    inputs:
      routine:
        description: daily or weekly
        default: daily

concurrency: ops-bot

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tabpro_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # A throwaway test database only. The bot never gets production secrets.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tabpro_test
      JWT_SECRET: ci-e2e-secret
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      GOOGLE_CALLBACK_URL: http://localhost:3099/api/auth/google/callback
      GH_TOKEN: ${{ github.token }}
      ROUTINE: ${{ github.event.inputs.routine || (github.event.schedule == '30 5 * * 1' && 'weekly') || 'daily' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Git identity
        run: |
          git config user.name "TabPro ops bot"
          git config user.email "ops-bot@users.noreply.github.com"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The workflow's own token: no extra GitHub app to install.
          github_token: ${{ github.token }}
          prompt: |
            You are the TabPro ops bot. Today's routine: ${{ env.ROUTINE }}.
            Read ops/README.md, ops/STATE.md and the newest entries of ops/LOG.md first,
            then do the "${{ env.ROUTINE }}" routine exactly as the handbook describes.
            Tools you have: git and gh (authenticated for this repo), node/yarn, and a
            test Postgres. Run the full end-to-end tests with `bash tests/e2e/ci.sh`
            and only merge a pull request after they pass on that branch.
            Finish by committing your ops/LOG.md and ops/STATE.md updates to main.
          claude_args: --max-turns 120 --allowedTools "Bash,Read,Edit,Write,Glob,Grep,WebFetch"
