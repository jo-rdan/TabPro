name: Watchdog

# Checks the live site every 30 minutes, like a customer would. If something is
# broken it opens one "🚨 Watchdog" issue (GitHub emails the owner); when the
# site is healthy again it closes that issue. The daily Claude routine reads
# these issues and fixes the cause.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE: https://skuzi.xyz
      API: https://tabpro-backend.onrender.com
      DEMO_VENUE: bcb1113e-15d8-433e-88a0-5ecfbb3e3e0d
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the live site
        id: probe
        run: |
          fail=""
          # The free server can take ~1 min to wake up, so retry before calling it down.
          try() { for i in 1 2 3; do out=$(curl -s -m 60 "$1") && echo "$out" | grep -q "$2" && return 0; sleep 20; done; return 1; }
          # Cheap checks, every run: these never touch the database.
          try "$API/health" '"status":"ok"'                      || fail="$fail\n- Server health check failed ($API/health)"
          try "$SITE/" '<div id="root">'                          || fail="$fail\n- Website did not load ($SITE)"

          # Database checks, every 2 hours only. On Neon's free plan every
          # query keeps the database awake for its 5-minute suspend window, so
          # probing each half hour would burn ~30 CU-hours a month on its own.
          # Twice an hour was also not what we lacked on 2026-10-19: the
          # database was down for hours and the watchdog never looked at it,
          # because /health answers "ok" without a database.
          if [ "$(( $(date -u +%H) % 2 ))" = "0" ] && [ "$(date -u +%M)" -lt 30 ]; then
            try "$API/health/db" '"db":"ok"'                      || fail="$fail\n- DATABASE unreachable ($API/health/db) — check the Neon compute allowance"
            try "$API/api/tabs/preview/5e5aec0c2f" '"venue"'      || fail="$fail\n- Scanning the demo table sticker failed (guests would see 'Hmm, that didn't work')"
          fi
          printf "%b" "$fail" > problems.txt
          cat problems.txt
          [ -z "$fail" ] && echo "healthy=true" >> "$GITHUB_OUTPUT" || echo "healthy=false" >> "$GITHUB_OUTPUT"
      - name: Report
        run: |
          repo="${{ github.repository }}"
          open=$(gh issue list -R "$repo" --label watchdog --state open --json number -q '.[0].number')
          if [ "${{ steps.probe.outputs.healthy }}" = "true" ]; then
            [ -n "$open" ] && gh issue close "$open" -R "$repo" -c "✅ Everything is working again ($(date -u '+%Y-%m-%d %H:%M UTC'))."
            exit 0
          fi
          gh label create watchdog -R "$repo" -c D93F0B -d "Opened by the watchdog" 2>/dev/null || true
          body=$(printf "The watchdog found a problem at %s:\n%s\n\nRun: %s" "$(date -u '+%Y-%m-%d %H:%M UTC')" "$(cat problems.txt)" "${{ github.server_url }}/$repo/actions/runs/${{ github.run_id }}")
          if [ -n "$open" ]; then gh issue comment "$open" -R "$repo" -b "$body"
          else gh issue create -R "$repo" -t "🚨 Watchdog: tabpro.lol has a problem" -l watchdog -b "$body"; fi
